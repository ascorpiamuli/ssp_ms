name: Build and Deploy SSPMIS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual trigger

# Grant permissions for GITHUB_TOKEN
permissions:
  contents: write
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sspmis-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sspmis-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Get version
      id: version
      run: |
        # Get commit hash for short version
        SHORT_SHA=$(git rev-parse --short=7 HEAD)
        DATE_VERSION=$(date +'%Y%m%d')
        RUN_NUMBER=${{ github.run_number }}

        # Create version from date and run number
        VERSION="${DATE_VERSION}.${RUN_NUMBER}"

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
        echo "DATE_VERSION=$DATE_VERSION" >> $GITHUB_OUTPUT

        echo "Version: $VERSION"
        echo "Short SHA: $SHORT_SHA"
        echo "Date version: $DATE_VERSION"

    - name: Build and push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.BACKEND_IMAGE }}:latest
          ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.DATE_VERSION }}
          ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        build-args: |
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
        tags: |
          ${{ env.FRONTEND_IMAGE }}:latest
          ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.VERSION }}
          ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.DATE_VERSION }}
          ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.SHORT_SHA }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create and push git tag
      if: success() && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        TAG="v${{ steps.version.outputs.VERSION }}"
        git tag $TAG
        git push origin $TAG
      continue-on-error: true

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd ~/sspmis

          # Pull latest images
          docker compose pull

          # Stop and remove old containers
          docker compose down

          # Start new containers
          docker compose up -d

          # Wait for containers to be ready
          sleep 15

          # Run migrations and clear cache
          if docker ps | grep -q sspmis_backend; then
            docker exec sspmis_backend php artisan migrate --force || true
            docker exec sspmis_backend php artisan config:clear
            docker exec sspmis_backend php artisan config:cache
            docker exec sspmis_backend php artisan route:cache
            docker exec sspmis_backend php artisan view:cache || true
            docker exec sspmis_backend chown -R www-data:www-data storage bootstrap/cache || true
          fi

          # Clean up old images
          docker image prune -f

          # Show running containers
          docker compose ps
