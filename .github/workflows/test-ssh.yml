name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Debug SSH Key
        run: |
          echo "Testing SSH key..."
          # Create a temp key file
          echo "${{ secrets.VPS_SSH_KEY }}" > /tmp/key
          chmod 600 /tmp/key
          ssh -i /tmp/key -o StrictHostKeyChecking=no -o ConnectTimeout=10 dockeruser@${{ secrets.VPS_HOST }} "echo 'SSH works!'"
        env:
          SSH_AUTH_SOCK: ""
